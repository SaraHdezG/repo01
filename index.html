<!DOCTYPE html>
<html lang="es-ES" class="h-full">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var path = location.pathname || "/";
        var href =
          path.indexOf("/japan") === 0
            ? "/japan/"
            : path.endsWith("/")
              ? path
              : path.replace(/[^/]+$/, "") || "./";
        if (href !== "./" && !href.endsWith("/")) href += "/";
        document.write('<base href="' + href + '">');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Lista de compras · Japón</title>
    <meta
      name="description"
      content="Lista de compras para Tokio (Ginza), 26–28 nov 2026."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', "system-ui", "-apple-system", "sans-serif"],
            },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT: "hsl(var(--primary))",
                foreground: "hsl(var(--primary-foreground))",
              },
              secondary: {
                DEFAULT: "hsl(var(--secondary))",
                foreground: "hsl(var(--secondary-foreground))",
              },
              muted: {
                DEFAULT: "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
              accent: {
                DEFAULT: "hsl(var(--accent))",
                foreground: "hsl(var(--accent-foreground))",
              },
              card: {
                DEFAULT: "hsl(var(--card))",
                foreground: "hsl(var(--card-foreground))",
              },
            },
            borderRadius: {
              lg: "var(--radius)",
              md: "calc(var(--radius) - 2px)",
              sm: "calc(var(--radius) - 4px)",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: light only;
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --card: 0 0% 100%;
        --card-foreground: 240 10% 3.9%;
        --popover: 0 0% 100%;
        --popover-foreground: 240 10% 3.9%;
        --primary: 240 5.9% 10%;
        --primary-foreground: 0 0% 98%;
        --secondary: 240 4.8% 95.9%;
        --secondary-foreground: 240 5.9% 10%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --accent: 240 4.8% 95.9%;
        --accent-foreground: 240 5.9% 10%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --border: 240 5.9% 90%;
        --input: 240 5.9% 90%;
        --ring: 240 5.9% 10%;
        --radius: 0.75rem;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --header-stack: 8.75rem;
        --app-chrome: 8.75rem;
      }
      body.map-active {
        overflow: hidden;
        height: 100dvh;
      }
      #app.map-active-root {
        max-width: 100%;
      }
      html {
        color-scheme: light only;
        background: hsl(var(--background));
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        overflow-x: hidden;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: Inter, system-ui, sans-serif;
        -webkit-text-fill-color: currentColor;
      }
      .chip-scroll {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .chip-scroll::-webkit-scrollbar {
        display: none;
      }
      .check-hit {
        position: relative;
        min-width: 2.75rem;
        min-height: 2.75rem;
      }
      .check-hit input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .check-hit .check-ui {
        pointer-events: none;
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease,
          color 0.15s ease;
      }
      .check-hit input:checked + .check-ui {
        transform: scale(1.02);
      }
      .check-hit input:active + .check-ui {
        transform: scale(0.96);
      }
      .tax-chevron {
        transition: transform 0.2s ease;
      }
      details.tax-panel[open] .tax-chevron {
        transform: rotate(180deg);
      }
      .leaflet-container {
        background: #ffffff !important;
        font-family: Inter, system-ui, sans-serif;
      }
      .map-pin-custom {
        background: transparent !important;
        border: none !important;
      }
      .store-section-anchor {
        display: block;
        height: 0;
        width: 100%;
        scroll-margin-top: calc(var(--header-stack) + var(--safe-top) + 11.25rem);
      }
      .map-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5000;
        max-width: 32rem;
        margin: 0 auto;
        border-top-left-radius: 1rem;
        border-top-right-radius: 1rem;
        border: 1px solid hsl(var(--border));
        background: hsl(var(--card));
        color: hsl(var(--card-foreground));
        box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.08);
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: hsl(var(--background)) !important;
          color: hsl(var(--foreground)) !important;
          color-scheme: light only !important;
        }
        .leaflet-container {
          background: #ffffff !important;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <main
      id="app"
      class="mx-auto w-full max-w-lg"
      style="padding-left: max(0px, env(safe-area-inset-left)); padding-right: max(0px, env(safe-area-inset-right))"
      aria-live="polite"
    ></main>
    <script src="data.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
